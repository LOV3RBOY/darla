name: TestFlight
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check signing secrets
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$K" ]; then echo "::error::App Store Connect secrets not set yet"; exit 1; fi
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 27 not available on this runner"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey.p8
      - name: Archive
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          IID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: SG33765Y24
        run: |
          set -o pipefail
          xcodebuild -project DARLA.xcodeproj -scheme DARLA -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/DARLA.xcarchive archive \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$IID" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION=${{ github.run_number }} | tee build/archive.log | grep -E "error:|warning: unused|ARCHIVE" || true
          test -d build/DARLA.xcarchive
      - name: Upload to TestFlight
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          IID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: SG33765Y24
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/DARLA.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/out -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$IID"
      - name: Build log
        if: failure()
        run: grep -E "error:" -A3 build/archive.log | head -80 || true
