name: TestFlight
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: testflight
  cancel-in-progress: true
env:
  RUN: ${{ github.run_number }}
  SHA: ${{ github.sha }}
  TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check signing secrets
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$K" ]; then echo "::error::App Store Connect secrets not set yet"; exit 1; fi
      - uses: actions/checkout@v5
      - run: ci/report.sh "checked out"
      - name: Select Xcode 27
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 27" || { echo "::error::Xcode 27 not available"; exit 1; }
          ci/report.sh "xcode selected"
      - name: Generate project
        timeout-minutes: 8
        run: |
          ci/report.sh "installing xcodegen"
          brew install xcodegen && xcodegen generate
          ci/report.sh "project generated"
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey.p8
      - name: Archive
        timeout-minutes: 15
        env:
          KID: ${{ secrets.ASC_KEY_ID || '8A77HRD47W' }}
          IID: f0ca6676-6d47-485a-804b-980f71405470
          TEAM: SG33765Y24
        run: |
          mkdir -p build
          ci/report.sh "archiving"
          ( while true; do sleep 60; ci/report.sh "archiving (live)" build/archive.log; done ) &
          if ! xcodebuild -project DARLA.xcodeproj -scheme DARLA -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/DARLA.xcarchive archive \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$IID" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="Apple Distribution" > build/archive.log 2>&1; then
            grep -E "error:" build/archive.log | sed 's#.*/Sources/##' | sort -u | head -40 | tee build/errors.txt | while IFS= read -r l; do echo "::error::$l"; done
            tail -30 build/archive.log
            exit 1
          fi
      - name: Upload to TestFlight
        timeout-minutes: 10
        env:
          KID: ${{ secrets.ASC_KEY_ID || '8A77HRD47W' }}
          IID: f0ca6676-6d47-485a-804b-980f71405470
          TEAM: SG33765Y24
        run: |
          ci/report.sh "exporting + uploading" build/archive.log
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/DARLA.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/out -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$IID" > build/export.log 2>&1 \
            || { grep -E "error" build/export.log | head -20 | tee build/errors.txt; exit 1; }
          tail -5 build/export.log
      - name: Publish status for Claude
        if: always()
        run: |
          { cat build/errors.txt 2>/dev/null; tail -12 build/archive.log 2>/dev/null; echo '--- export'; tail -25 build/export.log 2>/dev/null; } > /tmp/final.txt
          ci/report.sh "${{ job.status }}" /tmp/final.txt
