name: crashes
on:
  push:
    branches: [crash-pull]
jobs:
  pull:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID || '8A77HRD47W' }}
          IID: f0ca6676-6d47-485a-804b-980f71405470
        run: |
          printf '%s' "$P8" > ~/AuthKey.p8
          pip install -q pyjwt cryptography
          python3 ci/crashes.py
          mkdir p && cp crashes.txt p/ && cd p && git init -q && git checkout -q -b crash-log
          git -c user.name=ci -c user.email=ci@local add . && git -c user.name=ci -c user.email=ci@local commit -qm log
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} crash-log
